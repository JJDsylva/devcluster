# requires the one-time Authentik-side setup first (domain-level forward auth
# provider covering codeomelet.dev) - see SETUP.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # authentik namespace - middleware name - @kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.codeomelet.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  # argocd-server now serves plain HTTP (configs.params.
                  # server.insecure=true set in argocd.tf), so this is the
                  # plain http port, not https
                  name: http
