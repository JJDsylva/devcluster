# One shared middleware, referenced from any app's Ingress via:
#   traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
#
# Uses "domain level" forward auth mode in Authentik (not "single application")
# since every app sits under one shared root (codeomelet.dev) - domain-level
# means one login persists across all subdomains via a cookie scoped to
# .codeomelet.dev, and there's only ONE Provider to set up in Authentik,
# instead of one per app. See SETUP.md for the one-time Authentik-side setup.
#
# VERIFY the address below - port/service name depends on the authentik
# helm chart's generated Service. Check with:
#   kubectl get svc -n authentik
# Official authentik docs use port 9000 for the internal HTTP listener.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    # address: http://authentik-server.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
