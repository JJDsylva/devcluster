# Replace TUNNEL_ID_HERE with the ID printed by `cloudflared tunnel create`.
# Verify the traefik service name/namespace with: kubectl get svc -n traefik
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: 1e1d15b7-779d-4333-99ae-d1ce73edf821
    credentials-file: /etc/cloudflared/creds/credentials.json
    ingress:
      - hostname: argocd.codeomelet.dev
        service: http://traefik.traefik.svc.cluster.local:80
      - hostname: auth.codeomelet.dev
        service: http://traefik.traefik.svc.cluster.local:80
      - service: http_status:404
