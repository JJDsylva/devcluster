# ingress-nginx (kubernetes/ingress-nginx) was retired in March 2026 - no more
# releases, bugfixes, or security patches. Using Traefik instead: actively
# maintained, and Authentik's forward-auth integration is officially
# documented for it (docs.goauthentik.io/add-secure-apps/providers/proxy/server_traefik/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    # confirmed current as of writing (Aug 2026) - re-check at
    # https://github.com/traefik/traefik-helm-chart/releases before relying
    targetRevision: "41.2.0"
    helm:
      releaseName: traefik
      values: |
        # ClusterIP only - nothing needs a public LoadBalancer/NodePort,
        # cloudflared reaches this over the cluster network only.
        service:
          type: ClusterIP
        ports:
          web:
            port: 8000
          websecure:
            port: 8443
        # cloudflared connects to Traefik over plain HTTP (the "web"
        # entrypoint), so by default Traefik overwrites X-Forwarded-Proto
        # with "http" for that hop, even though cloudflared already sent
        # the correct "https" (reflecting how the browser actually reached
        # Cloudflare's edge). This makes Authentik think it's being
        # accessed over plain HTTP and refuse its setup flow. Trusting
        # this CIDR tells Traefik to pass through what cloudflared sends
        # instead of overwriting it. 10.244.0.0/16 is this cluster's
        # observed pod CIDR (confirmed from authentik-server's own logs) -
        # re-verify with `kubectl get pods -A -o wide` if this ever changes.
        additionalArguments:
          - "--entrypoints.web.forwardedheaders.trustedips=10.244.0.0/16"
          - "--entrypoints.websecure.forwardedheaders.trustedips=10.244.0.0/16"
        # Middleware/IngressRoute CRDs on by default in recent chart versions -
        # verify with: kubectl get crd | grep traefik.io
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
