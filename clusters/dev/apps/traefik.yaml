apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "41.3.0"
    helm:
      releaseName: traefik
      values: |
        # ClusterIP only - nothing needs a public LoadBalancer/NodePort,
        # cloudflared reaches this over the cluster network only.
        service:
          type: ClusterIP
        ports:
          web:
            port: 8000
          websecure:
            port: 8443
        additionalArguments:
          - "--entrypoints.web.forwardedheaders.trustedips=10.244.0.0/16"
          - "--entrypoints.websecure.forwardedheaders.trustedips=10.244.0.0/16"
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
